<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ramen City | Dokun ve Paylaş</title>
  
  <!-- Inter Font (Dünya standardı okunabilirlik) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    :root {
      --bg-main: #0c0e12;
      --card-bg: #151821;
      --card-border: #232733;
      --card-active-bg: rgba(245, 158, 11, 0.1);
      --card-active-border: #f59e0b;
      
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      
      --accent-gold: #f59e0b;
      --accent-gold-light: #fbbf24;
      --success-green: #10b981;
    }

    html, body {
      min-height: 100%;
      width: 100%;
      background-color: var(--bg-main);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-primary);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 14px) + 8px) 16px calc(env(safe-area-inset-bottom, 14px) + 10px);
      box-sizing: border-box;
      gap: 10px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Üst Başlık (Temiz, Net & Prestijli) */
    .header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
      padding-top: 2px;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: #ffffff;
      line-height: 1.15;
    }

    .brand-subtitle {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-gold);
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    /* Farklı Yorumlar Butonu (Öne Çıkarılmış & Çok Net) */
    .btn-shuffle-featured {
      width: 100%;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(217, 35, 46, 0.12) 100%);
      border: 1.5px solid rgba(245, 158, 11, 0.42);
      border-radius: 13px;
      padding: 9px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.12);
      font-family: inherit;
      flex-shrink: 0;
    }

    .btn-shuffle-featured:active {
      transform: scale(0.975);
      background: rgba(245, 158, 11, 0.24);
      border-color: var(--accent-gold);
    }

    .shuffle-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .shuffle-icon-box {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: rgba(245, 158, 11, 0.2);
      color: var(--accent-gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 0;
    }

    .shuffle-icon-box svg {
      width: 17px;
      height: 17px;
    }

    .shuffle-text {
      display: flex;
      flex-direction: column;
      text-align: left;
      gap: 1px;
    }

    .shuffle-main {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .shuffle-hint {
      font-size: 10.5px;
      color: var(--accent-gold-light);
      font-weight: 500;
      line-height: 1.2;
    }

    .shuffle-pill {
      font-size: 11px;
      font-weight: 700;
      background: var(--accent-gold);
      color: #0c0e12;
      padding: 4px 9px;
      border-radius: 7px;
      letter-spacing: 0.3px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(245, 158, 11, 0.3);
      flex-shrink: 0;
    }

    /* 5 Yorum Kartı Listesi */
    .review-cards {
      display: flex;
      flex-direction: column;
      gap: 9px;
      width: 100%;
      flex: 1;
      justify-content: space-between;
      min-height: 0;
    }

    .card {
      background: var(--card-bg);
      border: 1.2px solid var(--card-border);
      border-radius: 13px;
      padding: 12px 15px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      flex: 1;
      min-height: 0;
    }

    .card:active {
      transform: scale(0.985);
      border-color: var(--accent-gold);
    }

    .card.selected {
      background: var(--card-active-bg);
      border-color: var(--card-active-border);
      box-shadow: 0 4px 18px rgba(245, 158, 11, 0.2);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .stars {
      color: var(--accent-gold);
      font-size: 13px;
      letter-spacing: 1.8px;
    }

    .copy-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-gold-light);
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.28);
      padding: 3px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .copy-badge svg {
      width: 11px;
      height: 11px;
    }

    .copy-badge.copied {
      color: #ffffff;
      background: var(--success-green);
      border-color: var(--success-green);
      font-weight: 700;
    }

    .card-text {
      font-size: 13.5px;
      line-height: 1.48;
      color: #f1f5f9;
      font-weight: 450;
      transition: opacity 0.2s ease;
      display: block;
      margin: 0;
    }

    /* Alt Bölüm */
    .footer {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      padding: 4px 4px 8px;
    }

    .footer-guide {
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.35;
      padding: 0 4px;
    }
  </style>
</head>
<body>

    function getRandomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    // 5 Farklı Kategoriden 5 Özgün Yorum Seç & Kartlara Doldur
    function shuffleReviews() {
      // İkonu döndürerek tatlı ve belirgin bir tıklama hissi ver
      rotationAngle += 360;
      const iconBox = document.getElementById('shuffle-icon-box');
      if (iconBox) {
        iconBox.style.transform = `rotate(${rotationAngle}deg)`;
      }

      const selected = [
        getRandomItem(POOL_FOOD),       // Kart 1: Lezzet & Sunum
        getRandomItem(POOL_FAST),       // Kart 2: Hızlı Servis & Öğle
        getRandomItem(POOL_AMBIANCE),   // Kart 3: Ambiyans & Akşam
        getRandomItem(POOL_SERVICE),    // Kart 4: Temizlik & Karşılama
        getRandomItem(POOL_RECOMMEND)   // Kart 5: Tavsiye & Müdavimlik
      ];

      for (let i = 1; i <= 5; i++) {
        const textEl = document.getElementById(`card-text-${i}`);
        const badge = document.getElementById(`badge-${i}`);
        if (badge) {
          badge.classList.remove('copied');
          badge.innerHTML = `
            <span class="badge-label">Kopyala & Git</span>
            <svg viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          `;
        }

        const cardEl = document.querySelectorAll('.card')[i - 1];
        if (cardEl) {
          cardEl.classList.remove('selected', 'redirecting');
        }

        if (textEl) {
          textEl.style.opacity = '0';
          setTimeout(() => {
            textEl.textContent = selected[i - 1];
            textEl.style.opacity = '1';
          }, 110);
        }
      }
    }

    // Sayfa Açıldığında Rastgele 5 Yorum Yükle ve Konfeti Patlat
    window.addEventListener('load', () => {
      shuffleReviews();
      fireConfetti();
    });

    function fireConfetti() {
      const count = 75;
      const defaults = {
        origin: { y: 0.6 },
        colors: ['#d9232e', '#fbbf24', '#f59e0b', '#ffffff', '#10b981']
      };

      function fire(particleRatio, opts) {
        confetti(Object.assign({}, defaults, opts, {
          particleCount: Math.floor(count * particleRatio)
        }));
      }

      fire(0.25, { spread: 26, startVelocity: 40 });
      fire(0.2, { spread: 60 });
      fire(0.35, { spread: 75, decay: 0.91, scalar: 0.8 });
    }

    // Kart Seçildiğinde: Panoya Kopyala ve Anında Google Haritalar'a Yönlendir
    function handleCardClick(element, id) {
      if (element.classList.contains('redirecting')) return;
      element.classList.add('redirecting');

      document.querySelectorAll('.card').forEach((card) => {
        card.classList.remove('selected');
      });
      element.classList.add('selected');

      const activeBadge = document.getElementById(`badge-${id}`);
      if (activeBadge) {
        activeBadge.classList.add('copied');
        activeBadge.innerHTML = `
          <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" style="width: 12px; height: 12px;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
          </svg>
          <span class="badge-label">Kopyalandı! Açılıyor...</span>
        `;
      }

      const p = document.getElementById(`card-text-${id}`) || element.querySelector('.card-text');
      const textToCopy = p.textContent.replace(/^"|"$/g, '');

      // 1. Panoya Anında Kopyala
      copyToClipboard(textToCopy);

      // 2. Mini kutlama konfetisi
      confetti({
        particleCount: 25,
        spread: 45,
        origin: { y: 0.55 }
      });

      // 3. Google Haritalar'a Aç (Kopyalama işleminin tamamlanması ve görsel onay için 280ms)
      setTimeout(() => {
        window.location.href = GOOGLE_REVIEW_URL;
      }, 280);
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).catch(() => {
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.opacity = '0';
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
      } catch (err) {
        console.error('Kopyalama hatası:', err);
      }
      document.body.removeChild(textArea);
    }
